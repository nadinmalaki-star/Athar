<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ONE HOME. THOUSANDS OF CHOICES. — Athar Digital Clue</title><style>:root{--bg:#070707;--p:#111210;--t:#f3f2ed;--m:#aaa9a1;--l:#ffffff1f;--a:#ef6740}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#1b1c1a,#080908 55%,#050505);color:var(--t);font:15px Inter,Segoe UI,Arial,sans-serif}button,a{font:inherit}button{cursor:pointer}.screen{min-height:100vh;display:grid;place-items:center;padding:16px}.hero{width:min(620px,95vw);position:relative;border-radius:30px;overflow:hidden;border:1px solid var(--l);box-shadow:0 35px 90px #000a}.hero img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(#0000 20%,#0005 60%,#000e)}.hero .copy{position:absolute;z-index:2;left:7%;right:7%;bottom:7%}.k{font-size:10px;letter-spacing:.22em;color:#aaa9a1;text-transform:uppercase}.hero h1{font-size:clamp(42px,7vw,74px);line-height:.9;letter-spacing:-.05em;margin:13px 0}.hero h1 span{color:var(--a)}.sub{color:#ddd9d2;line-height:1.55;max-width:480px}.cta{margin-top:20px;border:0;border-radius:13px;padding:13px 18px;background:var(--a);color:#fff;font-weight:800}.app{width:min(1180px,96vw);margin:auto;padding:18px 0 28px}.top,.brand{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;padding-bottom:14px}.left{display:flex;align-items:center;gap:12px}.progress{width:150px;height:2px;background:#fff2}.progress i{display:block;height:100%;background:var(--a);width:20%}.lang{display:flex;gap:6px}.lang button{background:transparent;border:1px solid var(--l);border-radius:999px;color:#aaa;padding:7px 10px}.lang .on{background:#fff;color:#111}.logo{height:54px;width:270px;background:#fff;border-radius:12px;overflow:hidden}.logo img{width:100%;height:100%;object-fit:cover}.theme{font-size:10px;letter-spacing:.16em;color:#777;text-align:right}.panel{background:linear-gradient(#ffffff0b,#ffffff03);border:1px solid var(--l);border-radius:24px;padding:30px;box-shadow:0 24px 70px #0007}.q{font-size:clamp(29px,4vw,48px);line-height:1.04;letter-spacing:-.04em;margin:10px 0}.subq{color:var(--m);line-height:1.55}.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-top:24px}.opt{min-height:140px;text-align:left;background:#0c0d0c;color:#fff;border:1px solid #fff2;border-radius:17px;padding:16px;transition:.15s}.opt:hover{transform:translateY(-2px)}.opt.sel{border-color:var(--a);box-shadow:0 0 0 1px var(--a) inset;background:#ef67401a}.sym{display:block;color:#f18a62;font-size:25px;margin-bottom:28px}.num{font-size:10px;color:#666;float:right}.opt b{font-size:17px}.actions{display:flex;justify-content:space-between;margin-top:20px}.btn{padding:11px 16px;border-radius:11px;border:1px solid var(--l);background:transparent;color:#ddd}.primary{background:var(--a);border-color:var(--a);font-weight:800}.obs{margin-top:18px;padding:14px;border-left:2px solid var(--a);background:#ffffff06;color:#aaa;line-height:1.5;font-size:13px}.obs strong{display:block;font-size:10px;letter-spacing:.18em;color:#eee;margin-bottom:5px}.reveal{display:none}.reveal.show{display:block}.reveal h2{font-size:clamp(34px,5vw,62px);line-height:.98;letter-spacing:-.05em;margin:0 0 14px}.reveal p{color:#aaa;line-height:1.65;max-width:900px}.quote{margin:23px 0;padding:18px;border-left:3px solid var(--a);background:linear-gradient(90deg,#ef67401f,#0000);font-size:22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}.card{padding:17px;border:1px solid #fff2;border-radius:16px;background:#0c0d0c}.card small{display:block;color:#777;font-size:10px;letter-spacing:.15em;margin-bottom:9px}.card strong{font-size:16px;line-height:1.3}.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:23px}.node{padding:17px;border:1px solid #fff2;border-radius:15px;background:#0c0d0c}.node small{display:block;color:#777;font-size:9px;margin-bottom:9px}.athar{margin-top:23px;padding:20px;border-radius:18px;border:1px solid #ef674055;background:#ef67401a}.athar h3{margin:0 0 8px}.athar p{margin:0}.ctas{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-top:23px}.ctas a{min-height:120px;padding:19px;border:1px solid #fff2;border-radius:17px;background:#0b0c0b;color:#fff;text-decoration:none;display:flex;flex-direction:column;justify-content:center}.ctas span{font-size:10px;color:#777;margin-bottom:10px}.ctas strong{font-size:19px;color:#f18a62}.footer{margin-top:15px;display:flex;justify-content:space-between;color:#70716b;font-size:11px}.footer img{height:24px;width:auto}.ar{direction:rtl}.ar .opt,.ar .subq,.ar .reveal p,.ar .ctas a{text-align:right}.ar .obs{border-left:0;border-right:2px solid var(--a)}.ar .quote{border-left:0;border-right:3px solid var(--a);background:linear-gradient(270deg,#ef67401f,#0000)}@media(max-width:900px){.opts{grid-template-columns:1fr 1fr}.flow{grid-template-columns:1fr 1fr}.ctas{grid-template-columns:1fr}}@media(max-width:600px){.panel{padding:20px}.hero h1{font-size:43px}.logo{width:220px;height:48px}.grid{grid-template-columns:1fr}.footer{flex-direction:column;gap:8px;align-items:flex-start}}</style></head><body><div id="root"></div><script>const C={hero:'https://abdeengroup.com/wp-content/uploads/2022/12/elite-home1-1-580x380_c.jpg',logo:'https://media.licdn.com/dms/image/v2/C4E1BAQEIFLmrFtmkqQ/company-background_10000/company-background_10000/0/1605162317412/abdeen_elite_home_cover?e=2147483647&t=VtzUvYEkK1HO-lSjU3zh4fE0DQ7StJfAsM-207Qu934&v=beta',athar:'https://github.com/nadinmalaki-star/Athar/raw/main/clue/smart-palestine/assets/athar-logo-en.png',qs:[['THE NEED','الاحتياج','What are you trying to do with your home?','شو بدك تعمل ببيتك؟',[['⌂','Refresh a space'],['＋','Furnish a new home'],['□','Complete one room'],['⌕','Find one piece']],[['⌂','أغيّر مساحة'],['＋','أجهّز بيت'],['□','أكمّل غرفة'],['⌕','أدوّر على قطعة']]],['THE MOMENT','المرحلة','Where are you in the journey?','وين وصلت بالرحلة؟',[['◌','Just exploring'],['◍','Know the space'],['↔','Comparing'],['→','Ready to buy']],[['◌','لسّا بستكشف'],['◍','عارف المساحة'],['↔','بقارن'],['→','جاهز أشتري']]],['THE PRIORITY','الأولوية','What matters most when you decide?','شو الأهم لما تقرر؟',[['✦','Style'],['⌁','Practicality'],['◫','Budget'],['✚','Complete the space']],[['✦','الستايل'],['⌁','العملية'],['◫','الميزانية'],['✚','أكمّل المساحة']]],['THE DECISION','القرار','When you like a few options, what helps you move forward?','لما تعجبك كذا قطعة، شو بيساعدك تكمل؟',[['◒','See a full look'],['↔','Compare options'],['⌁','See similar'],['◡','Ask someone']],[['◒','أشوف شكل كامل'],['↔','أقارن الخيارات'],['⌁','أشوف شبيه'],['◡','أسأل حدا']]],['THE NEXT STEP','الخطوة التالية','What would make the next step easier?','شو بخلي الخطوة الجاية أسهل؟',[['✓','A shortlist'],['◇','Relevant picks'],['⌖','Store direction'],['◡','Personal help']],[['✓','قائمة مختصرة'],['◇','اختيارات أنسب'],['⌖','أعرف الفرع'],['◡','مساعدة شخصية']]]]};let lang='en',i=0,sel=null,R=document.getElementById('root');function t(a,b){return lang==='en'?a:b}function dir(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';R.className=lang==='ar'?'ar':''}function hero(){R.innerHTML='<div class="screen"><div class="hero"><img src="'+C.hero+'"><div class="copy"><div class="k">ATHAR DIGITAL CLUE · ABDEEN</div><h1>'+t('ONE HOME. <span>THOUSANDS OF CHOICES.</span>','بيت واحد. <span>آلاف الاختيارات.</span>')+'</h1><div class="sub">'+t('What if the journey started with what the customer needs — before the product?','ماذا لو بدأت الرحلة من احتياج العميل — قبل المنتج؟')+'</div><button class="cta" id="go">'+t('Explore the clue →','ابدأ التجربة ←')+'</button></div></div></div>';dir();document.getElementById('go').onclick=()=>app()}function app(){i=0;sel=null;dir();R.innerHTML='<div class="app"><div class="top"><div class="left"><span id="count">01 / 05</span><span class="progress"><i id="bar"></i></span><span class="clue-label">'+t('DIGITAL CLUE','دليل رقمي')+'</span></div><div class="lang"><button id="en" class="'+(lang==='en'?'on':'')+'">EN</button><button id="ar" class="'+(lang==='ar'?'on':'')+'">AR</button></div></div><div class="brand"><div class="logo"><img src="'+C.logo+'"></div><div class="theme">'+t('ONE HOME. THOUSANDS OF CHOICES.','بيت واحد. آلاف الاختيارات.')+'</div></div><section class="panel" id="q"></section><section class="panel reveal" id="r"></section><div class="footer"><img src="'+C.athar+'"><span>Web • Mobile • Systems • Growth</span></div></div>';document.getElementById('en').onclick=()=>{lang='en';app()};document.getElementById('ar').onclick=()=>{lang='ar';app()};draw()}function draw(){let q=C.qs[i],o=lang==='en'?q[4]:q[5];document.getElementById('count').textContent='0'+(i+1)+' / 05';document.getElementById('bar').style.width=((i+1)/5*100)+'%';document.getElementById('r').classList.remove('show');document.getElementById('q').style.display='block';document.getElementById('q').innerHTML='<div class="k">'+t(q[0],q[1])+' · 0'+(i+1)+' / 05</div><h2 class="q">'+t(q[2],q[3])+'</h2><p class="subq">'+t('Choose the option that best describes your journey.','اختار الخيار الأقرب لرحلتك.')+'</p><div class="opts">'+o.map((x,n)=>'<button class="opt" data-n="'+n+'"><span class="sym">'+x[0]+'</span><span class="num">0'+(n+1)+'</span><b>'+x[1]+'</b></button>').join('')+'</div><div class="actions"><button class="btn" id="back">'+t('Back','رجوع')+'</button><button class="btn primary" id="next" disabled>'+t('Continue →','متابعة ←')+'</button></div><div class="obs"><strong>'+t("WHAT WE'RE EXPLORING",'ما نستكشفه')+'</strong>'+t('A customer can arrive with a need rather than a product in mind. We’re exploring how that need could become a clearer signal for the next interaction.','قد يصل العميل وهو يعرف ما يحتاجه، دون أن يعرف المنتج الذي يبدأ منه. نستكشف هنا كيف يمكن لهذا الاحتياج أن يتحول إلى إشارة أوضح للخطوة التالية.')+'</div>';document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{document.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');sel=b.dataset.n;document.getElementById('next').disabled=false});document.getElementById('next').onclick=()=>{i++;sel=null;i<5?draw():reveal()};document.getElementById('back').onclick=()=>{i? (i--,draw()):hero()}}function reveal(){document.getElementById('q').style.display='none';document.getElementById('bar').style.width='100%';let r=document.getElementById('r');r.classList.add('show');r.innerHTML='<div class="k">'+t('THE REVEAL','الخلاصة')+'</div><h2>'+t('Abdeen already gives customers a wide range of products and possibilities.','عابدين أصلًا يوفّر للعميل مساحة واسعة من المنتجات والخيارات.')+'</h2><p>'+t('We explored one simple question: what if the digital journey helped customers discover where to start before they start browsing?','استكشفنا سؤالًا بسيطًا: ماذا لو ساعدت الرحلة الرقمية العميل على اكتشاف من أين يبدأ، قبل أن يبدأ بالتصفّح؟')+'</p><div class="quote">'+t('Customer need → clearer intent → more relevant direction → better conversation','احتياج العميل ← نية أوضح ← اتجاه أنسب ← حوار أفضل')+'</div><div class="grid"><div class="card"><small>01 · WHAT WE SAW</small><strong>'+t('A need can be more useful than a product name as the first signal in the journey.','قد يكون احتياج العميل إشارة أولى أكثر فائدة من اسم المنتج نفسه.')+'</strong></div><div class="card"><small>02 · WHY WE BUILT THIS</small><strong>'+t('To show how that early signal could shape a more guided digital experience.','لنوضح كيف يمكن لهذه الإشارة المبكرة أن تشكّل تجربة رقمية أكثر توجيهًا.')+'</strong></div><div class="card"><small>03 · WHAT THIS COULD ADD</small><strong>'+t('More relevant discovery, clearer customer intent and more useful conversations.','اكتشاف أكثر صلة، وفهم أوضح لنية العميل، وحوارات أكثر فائدة.')+'</strong></div><div class="card"><small>04 · THE BUSINESS CONNECTION</small><strong>'+t('The same journey could connect digital discovery with products, branches and the next human interaction.','ويمكن للرحلة نفسها أن تربط الاكتشاف الرقمي بالمنتجات والفروع والخطوة البشرية التالية.')+'</strong></div></div><div class="flow">'+(lang==='en'?['Customer need','Intent signal','Relevant direction','Next conversation']:['احتياج العميل','إشارة نية','اتجاه أنسب','الحوار التالي']).map((x,n)=>'<div class="node"><small>0'+(n+1)+'</small><b>'+x+'</b></div>').join('')+'</div><div class="athar"><h3>'+t('WHAT ATHAR COULD BUILD FROM HERE','شو ممكن يعمل أثر من هون')+'</h3><p>'+t('This is only the starting point. Athar can turn this kind of interaction into a branded digital layer connected to the customer journey — designed around Abdeen’s business, customers and sales process.','هاي فقط نقطة البداية. أثر ممكن يحوّل هذا النوع من التفاعل إلى طبقة رقمية مرتبطة برحلة العميل — مصممة حول أعمال عابدين وعملائها ورحلة البيع لديها.')+'</p></div><div class="actions"><button class="btn" id="again">'+t('Replay clue ↗','إعادة التجربة ↗')+'</button></div><div class="ctas"><a href="mailto:hello@studioathar.studio?subject=Abdeen%20Digital%20Clue%20%E2%80%94%20Let%27s%20explore%20this"><span>01</span><strong>'+t('Let’s explore this for Abdeen','خلينا نستكشف الفكرة لعابدين')+'</strong></a><a href="https://studioathar.studio/" target="_blank"><span>02</span><strong>'+t('Meet Athar','تعرّف على أثر')+'</strong></a><a href="https://studioathar.studio/solution-indicator/?lang=en" target="_blank"><span>03</span><strong>'+t('See how we think','شوف كيف بنفكّر')+'</strong></a></div>';document.getElementById('again').onclick=()=>{i=0;draw()}}hero();</script></body></html>
