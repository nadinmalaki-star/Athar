d:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.02));border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:0 20px 70px rgba(0,0,0,.26)}.section-kicker{font-size:11px;letter-spacing:.22em;color:#adb7ba;margin-bottom:14px}.qtitle{font-size:clamp(25px,3vw,38px);line-height:1.08;margin:0 0 10px;max-width:820px}.qsub{font-size:15px;line-height:1.55;color:var(--muted);margin:0 0 20px}.options{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px}.opt{position:relative;min-height:138px;text-align:left;border:1px solid rgba(255,255,255,.11);background:#0b1115;color:#fff;border-radius:17px;padding:15px;cursor:pointer;transition:.18s}.opt:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.22)}.opt.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset;background:linear-gradient(180deg,var(--accent-soft),#0b1115)}.opt .sym{font-size:25px;display:block;margin-bottom:24px;opacity:.9}.opt .num{position:absolute;right:11px;top:10px;font-size:11px;color:#788487}.opt b{font-size:22px;line-height:1.15;display:block}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:22px}.btn{border:1px solid rgba(255,255,255,.16);background:transparent;color:#d4dcde;border-radius:12px;padding:12px 18px;cursor:pointer}.btn.primary{background:var(--accent);color:#0b0f10;border-color:transparent;font-weight:700;font-size:16px}.btn:disabled{opacity:.4;cursor:not-allowed}.obs{margin-top:18px;padding:12px 14px;border-left:2px solid var(--accent);background:rgba(255,255,255,.03);font-size:12px;color:#aebabc;line-height:1.45}.obs strong{display:block;font-size:10px;letter-spacing:.18em;color:#e1e7e9;margin-bottom:5px}.reveal{display:none}.reveal.show{display:block}.reveal h2{font-size:clamp(28px,4vw,46px);line-height:1.06;margin:0 0 12px;max-width:900px}.reveal p{font-size:16px;color:var(--muted);line-height:1.6;max-width:820px}.quote{margin:24px 0;padding:20px;border-left:3px solid var(--accent);background:l Relevant model"}, {"icon": "⌁", "label": "Charging path"}, {"icon": "⚙", "label": "Service path"}, {"icon": "⌘", "label": "Follow-up"}], "opts_ar": [{"icon": "▣", "label": "الموديل المناسب"}, {"icon": "⌁", "label": "مسار الشحن"}, {"icon": "⚙", "label": "مسار الخدمة"}, {"icon": "⌘", "label": "المتابعة"}]}, {"title_en": "THE CLUE", "title_ar": "الفكرة", "q_en": "What if vehicle interest could start one connected journey across vehicle, charging and service?", "q_ar": "ماذا لو أصبح اهتمام العميل بالسيارة بدايةً لرحلة واحدة مترابطة تشمل السيارة والشحن والخدمة؟", "opts_en": [{"icon": "◎", "label": "Discover"}, {"icon": "⌘", "label": "Connect"}, {"icon": "△", "label": "Prepare"}, {"icon": "⌁", "label": "Continue"}], "opts_ar": [{"icon": "◎", "label": "اكتشاف"}, {"icon": "⌘", "label": "ربط"}, {"icon": "△", "label": "تحضير"}, {"icon": "⌁", "label": "متابعة"}]}], "obs_en": "eMobility brings vehicles and charging solutions into one ecosystem. We're exploring how the digital journey could continue around the car, charging and service with the customer context carried forward.", "obs_ar": "تجمع eMobility بين السيارات وحلول الشحن ضمن منظومة واحدة. نستكشف هنا كيف يمكن أن تستمر الرحلة الرقمية حول السيارة والشحن والخدمة مع الحفاظ على سياق العميل.", "reveal_title": "The car is one part of an electric mobility journey.", "reveal_ar": "السيارة هي جزء من رحلة التنقل الكهربائي؛ الفكرة هي أن تبقى السيارة والشحن والخدمة متصلة ضمن رحلة واحدة.", "reveal_text": "For eMobility, the interesting digital layer sits around the ecosystem: vehicle, charging, service and the next interaction. This is a concept, not a claim about the current setup.", "reveal_ar_text": "تصوّر لطبقة رقمية تربط اهتمام العميل بالسيارة مع احتياج الشحن والخدمة والخطوة التالية، بدل التعامل مع كل مرحلة بمعزل عن الأخرى.", "concept": "An electric-mobility journey layer", "concept_ar": "رحلة رقمية تربط السيارة بالشحن وما بعدها", "nodes": ["Vehicle", "Charge", "Service", "Support", "Continue"], "nodes_ar": ["السيارة", "الشحن", "الخدمة", "الدعم", "متابعة"]};let lang='en',step=0,selected=null;const root=document.getElementById('root');

function t(en,ar){return lang==='en'?en:ar}

function draw(){document.getElementById('prog').style.width=((step+1)/6*100)+'%';if(step<QUESTIONS.length){const q=QUESTIONS[step],opts=lang==='en'?q.opts_en:q.opts_ar;document.getElementById('quiz').style.display='block';document.getElementById('reveal').classList.remove('show');document.getElementById('quiz').innerHTML=`<div class="section-kicker">${lang==='en'?q.title_en:q.title_ar} · 0${step+1} / 05</div><h2 class="qtitle">${lang==='en'?q.q_en:q.q_ar}</h2><p class="qsub">${t('Select the option that best describes the journey.','اختاروا الخيار الأقرب إلى الرحلة.')}</p><div class="options">${opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="sym">${o.icon}</span><span class="num">0${i+1}</span><b>${o.label}</b></button>`).join('')}</div><div class="actions"><button class="btn" id="back">${t('Back','رجوع')}</button><button class="btn primary" id="next" disabled>${t('Continue →','متابعة ←')}</button></div><div class="obs"><strong>${t('WHAT WE\'RE EXPLORING','ما نستكشفه')}</strong>${t(CONFIG.obs_en,CONFIG.obs_ar)}</div>`;document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{document.querySelectorAll('.opt').forEach(z=>z.classList.remove('sel'));b.classList.add('sel');selected=b.dataset.i;document.getElementById('next').disabled=false});document.getElementById('next').onclick=()=>{step++;selected=null;draw()};document.getElementById('back').onclick=()=>{if(step>0){step--;selected=null;draw()}else hero()}}
else{document.getElementById('quiz').style.display='none';const r=document.getElementById('reveal');r.classList.add('show');r.innerHTML=`<div class="section-kicker">${t('THE REVEAL','الخلاصة')}</div><h2>${t(CONFIG.reveal_title,CONFIG.reveal_ar)}</h2><p>${t(CONFIG.reveal_text,CONFIG.reveal_ar_text)}</p><div class="quote">${t(CONFIG.concept,CONFIG.concept_ar)}</div><div class="system">${(lang==='en'?CONFIG.nodes:CONFIG.nodes_ar).map((n,i)=>`<div class="node"><small>0${i+1}</small><b>${n}</b></div>`).join('')}</div><div class="actions"><button class="btn primary" id="replay">${t('Replay clue ↗','إعادة التجربة ↗')}</button></div><div class="cta-grid"><a class="cta-card" href="mailto:hello@studioathar.studio"><span>01</span><strong>${t('Share your feedback','شاركنا رأيك')}</strong></a><a class="cta-card" href="https://studioathar.studio/" target="_blank" rel="noopener"><span>02</span><strong>${t('Meet Athar','تعرّف على أثر')}</strong></a><a class="cta-card" href="https://studioathar.studio/solution-indicator/?lang=en" target="_blank" rel="noopener"><span>03</span><strong>${t('What could we improve?','ماذا يمكن أن نحسّن؟')}</strong></a></div>`;document.getElementById('replay').onclick=()=>{step=0;selected=null;draw()}}}
